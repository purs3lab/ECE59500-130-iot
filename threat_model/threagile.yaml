#    technical_assets_inside:       # technical asset ids
#      - some-component
#    trust_boundaries_nested:       # boundary ids, for boundaries inside this one
#      - some-inner-boundary
#
# Anything outside every boundary (here: the dashboard browser) is treated as
# "the internet". Data crossing a boundary is what triggers many of the rules.

