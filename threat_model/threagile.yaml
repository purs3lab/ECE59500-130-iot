threagile_version: 1.0.0

# =============================================================================
# SmartLock V2 - Threagile starter model (Lab 3)
# =============================================================================
#
# This file already runs. Try it before changing anything:
#
#   docker run --rm -it -v "$(pwd)":/app/work threagile/threagile -verbose -model /app/work/threagile.yaml -output /app/work
#
# What's GIVEN (you may adjust it if your design differs, but you don't have to):
#   - metadata, data assets (with CIA ratings), technical asset properties,
#     trust boundaries
#
# What you FILL IN - search for "TODO":
#   1. data_assets_processed / data_assets_stored for every technical asset
#   2. every communication link: uncomment it, then set its protocol,
#      authentication, authorization, readonly flag and the data it carries
#   3. risk_tracking for every risk of severity "elevated" or higher
#      (see the long explanation right above the risk_tracking section)
#
# Model what you actually BUILT, not what you wish you had built. If a link
# has no authentication, say "none" - that's what the analysis needs to see.
#
# Every allowed enum value (protocols, technologies, statuses, ...):
#   docker run --rm -it threagile/threagile -list-types
#
# Keep "title" at 31 characters or fewer - Threagile uses it as an Excel sheet
# name and fails before writing report.pdf if it's longer.
# =============================================================================


title: SmartLock V2

date: 2026-11-01            # TODO: today's date

author:
  name: TODO Your Name      # TODO
  homepage: ""

management_summary_comment: >
  Threat model for the part3 SmartLock system: two Pico W locks publishing
  over MQTT (shiftr.io) to an edge relay (edge.py on a laptop), which mirrors
  state into Firestore. A public dashboard reads Firestore, and a phone-based
  controller pairs with / unlocks the locks through Firestore.

business_criticality: critical

business_overview:
  description: >
    A smart door lock. The door must open for the PIN holder or a paired
    controller, and for nobody else.

technical_overview:
  description: >
    Pico W (x2) - MQTT - shiftr.io broker - MQTT - edge.py (laptop) -
    Firestore - dashboard and controller pages (Firebase Hosting).

# Optional free-text sections - shown in the report, not used by the risk rules.
questions:
abuse_cases:
security_requirements:

tags_available:
  - pico-w
  - micropython
  - shiftr
  - mqtt
  - gcp
  - firestore
  - firebase-hosting
  - indexeddb


# =============================================================================
# DATA ASSETS - the information worth protecting. (GIVEN)
# =============================================================================
#
# Template:
#
#  Some Data Asset:                  # display name
#    id: some-data                   # what everything else references
#    description: ...
#    usage: business                 # business | devops
#    origin: ...                     # where it comes from
#    owner: ...
#    quantity: few                   # very-few | few | many | very-many
#    confidentiality: confidential   # public | internal | restricted | confidential | strictly-confidential
#    integrity: critical             # archive | operational | important | critical | mission-critical
#    availability: important         # same scale as integrity
#    justification_cia_rating: ...   # why those three ratings
#

data_assets:

  Device Attestation Private Key:
    id: device-attestation-key
    description: Per-device ECDSA P-256 private key (device_private_key.bin), generated on the Pico by keygen_device.py and never exported.
    usage: business
    origin: Generated on-device
    owner: Lock owner
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: Anyone holding it can sign telemetry that edge.py marks as attested.

  Device Public Keys:
    id: device-public-keys
    description: device_pubkey_<LOCKID>.der files copied by hand from each Pico to the edge laptop.
    usage: business
    origin: Copied out-of-band at provisioning
    owner: Lock owner
    quantity: very-few
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: Public, but swapping one makes edge.py trust a forged identity.

  Controller Identity Private Key:
    id: controller-identity-key
    description: Phone's ECDSA key pair from part2, stored non-extractable in the browser's IndexedDB.
    usage: business
    origin: Generated in the phone browser (Web Crypto)
    owner: Lock user
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: Signs unlock responses - equivalent to a door key.

  Paired Controller Public Keys:
    id: paired-controllers
    description: paired_device.json on each Pico - the device_id -> public key list of authorized controllers.
    usage: business
    origin: Pairing protocol
    owner: Lock owner
    quantity: few
    confidentiality: internal
    integrity: mission-critical
    availability: critical
    justification_cia_rating: Adding a key here is equivalent to handing out a door key.

  PIN Hash:
    id: pin-hash
    description: Salted PIN hash in pin_store.json on each Pico.
    usage: business
    origin: Init phase on keypad
    owner: Lock owner
    quantity: very-few
    confidentiality: confidential
    integrity: mission-critical
    availability: critical
    justification_cia_rating: Offline-crackable (small PIN space) if extracted from flash.

  MQTT Broker Token:
    id: mqtt-token
    description: Single shared shiftr.io credential (user "secure") used by both Picos and edge.py, with full publish/subscribe access.
    usage: devops
    origin: shiftr.io instance
    owner: Course staff
    quantity: very-few
    confidentiality: confidential
    integrity: important
    availability: important
    justification_cia_rating: Grants publish on every topic, including command topics for every lock.

  GCP Service Account Key:
    id: gcp-sa-key
    description: Service account JSON key used by edge.py (Admin SDK, bypasses Firestore rules).
    usage: devops
    origin: GCP IAM
    owner: Lock owner
    quantity: very-few
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: Full read/write to the whole Firestore DB, rules not applied.

  Pairing Request:
    id: pairing-request
    description: "{code, pubkey, name, sig} written by the controller to pairing_requests/{lockid} and relayed to the device. Contains the 6-digit one-time code in plaintext."
    usage: business
    origin: Controller page
    owner: Lock user
    quantity: few
    confidentiality: confidential
    integrity: critical
    availability: operational
    justification_cia_rating: The code is the only thing proving physical presence at the keypad during cloud pairing.

  Pairing Status:
    id: pairing-status
    description: Result of a pairing attempt in pairing_status/{lockid}.
    usage: business
    origin: Device via edge.py
    owner: Lock owner
    quantity: few
    confidentiality: public
    integrity: important
    availability: operational
    justification_cia_rating: World-readable, low value.

  Unlock Exchange:
    id: unlock-exchange
    description: commands/{lockid} - device_id, device-issued nonce, and the controller's signature over LOCKID:UNLOCK:nonce:device_id.
    usage: business
    origin: Controller page + device
    owner: Lock user
    quantity: many
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: World-readable by design; integrity protected by the signature and single-use nonce.

  Lock Events:
    id: lock-events
    description: Status/unlock/pairing events published by the Picos with attestation, stored as locks/{lockid} and locks/{lockid}/logs.
    usage: business
    origin: Picos
    owner: Lock owner
    quantity: very-many
    confidentiality: public
    integrity: important
    availability: operational
    justification_cia_rating: Public dashboard data; tampering misleads the owner but does not open the door.

  Webapp Code:
    id: webapp-code
    description: Static HTML/JS for the dashboard and controller pages, including the (non-secret) firebaseConfig.
    usage: devops
    origin: Course repo
    owner: Lock owner
    quantity: few
    confidentiality: public
    integrity: critical
    availability: important
    justification_cia_rating: Modified controller JS could exfiltrate signatures or sign attacker-chosen messages.

# =============================================================================
# TECHNICAL ASSETS - the components and what talks to what.
# =============================================================================
#
# Template:
#
#  Some Component:
#    id: some-component
#    description: ...
#    type: process                   # external-entity | process | datastore
#    usage: business
#    used_as_client_by_human: false  # true for browsers/apps a person uses
#    out_of_scope: false
#    justification_out_of_scope:
#    size: application               # system | service | application | component
#    technology: web-server          # see -list-types (iot-device, browser, database, ...)
#    tags:
#    internet: false                 # directly reachable from the internet?
#    machine: physical               # physical | virtual | container | serverless
#    encryption: none                # encryption of data AT REST on this asset
#    owner: ...
#    confidentiality: ...            # CIA of the asset itself - usually the
#    integrity: ...                  #   highest rating of the data it holds
#    availability: ...
#    justification_cia_rating: ...
#    multi_tenant: false
#    redundant: false
#    custom_developed_parts: true    # did you write code that runs here?
#    data_assets_processed:          # data that passes through it (list of data asset ids)
#      - some-data
#    data_assets_stored:             # data it keeps at rest
#      - some-data
#    data_formats_accepted:          # json | xml | serialization | file | csv
#      - json
#    communication_links:            # OUTGOING connections - defined on the side
#                                    # that initiates the connection
#      Some Link:
#        target: some-other-component   # id of the technical asset it connects to
#        description: ...
#        protocol: https                # see -list-types (https, mqtt, nosql-access-protocol-encrypted, ...)
#        authentication: none           # none | credentials | session-id | token | client-certificate | two-factor | externalized
#        authorization: none            # none | technical-user | enduser-identity-propagation
#        tags:
#        vpn: false
#        ip_filtered: false
#        readonly: false                # true if the initiator only ever reads
#        usage: business
#        data_assets_sent:              # initiator -> target
#          - some-data
#        data_assets_received:          # target -> initiator (responses, subscriptions)
#          - some-data
#
# "authentication" is how the TARGET knows who is connecting. "authorization"
# is whether access is then limited per identity: technical-user = one service
# identity, enduser-identity-propagation = per-end-user permissions.
#
# Threagile's protocol list has no MQTT-over-TLS value - use "mqtt" and deal
# with what the analysis says about it during triage.

