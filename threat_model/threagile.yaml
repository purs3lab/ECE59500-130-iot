# =============================================================================
# RISK TRACKING - your triage of what Threagile found. (TODO)
# =============================================================================
#
# Workflow:
#   1. Finish the model above and run Threagile.
#   2. Open risks.xlsx (or report.pdf) and list every risk whose Severity is
#      "elevated", "high" or "critical".
#   3. Add one entry below per risk, keyed by its exact risk ID.
#   4. Re-run Threagile. A typo in an ID fails the run with "risk id not
#      found", so you'll know immediately.
#
# --- Where do risk IDs come from? ---
#
# Every risk Threagile generates has an ID made of the rule name plus the
# elements involved, separated by "@". You don't construct these yourself -
# copy them from the "ID" column of risks.xlsx (or the small grey text under
# each risk in report.pdf). Examples of the shapes you'll see:
#
#   missing-hardening@some-component
#     rule "missing-hardening", about one technical asset
#
#   missing-authentication@client-app>some-link@client-app@some-server
#     rule @ <asset id>><link name, lowercased, spaces -> dashes> @ source asset @ target asset
#
# --- Shortcut: let Threagile write the skeleton for you ---
#
#   docker run --rm -it -v "$(pwd)":/app/work threagile/threagile -model /app/work/threagile.yaml -output /app/work -execute-model-macro seed-risk-tracking
#
# Type "Yes" when asked. It adds an entry with status "unchecked" for EVERY
# untracked risk. Fill in the elevated+ ones and delete the rest. WARNING: the
# macro rewrites the whole file and deletes every comment in it (including
# this one) - commit or copy this file first.
#
# --- What an entry looks like ---
#
#  "missing-hardening@some-component":   # quote the key - IDs contain @ and >
#    status: accepted                    # see below
#    justification: >
#      <Where in YOUR design this is handled, or why it's acceptable / doesn't
#      apply - cite a file, function or Firestore rule.>
#      ATT&CK: <Txxxx[.yyy] (Technique Name)> - or "no technique fits" + one sentence why.
#    date: 2026-11-01
#    checked_by: Your Name
#
# Statuses you should use:
#   mitigated       your design already defends against it - say where
#   accepted        it's real, you're not fixing it - say why that's OK and
#                   what the residual risk is
#   false-positive  it doesn't actually apply to this system - say why the
#                   rule fired anyway
#   (Threagile also knows unchecked, in-discussion and in-progress - don't
#   leave any elevated+ risk in those states.)
#
# --- Example (a made-up thermostat system, NOT this lab) ---
#
#  "missing-authentication@phone-app>set-temperature@phone-app@thermostat-api":
#    status: mitigated
#    justification: >
#      The link is marked "none" because the HTTP request itself carries no
#      session, but every request body is HMAC-signed with a per-phone key
#      checked in api/handlers.py:verify_hmac() before any setpoint changes.
